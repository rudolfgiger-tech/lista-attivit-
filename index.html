<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Mia Nuova Lista</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .todo-container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }
        input[type="text"]:focus {
            border-color: #4caf50;
        }
        button {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #45a049;
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            margin-bottom: 20px; /* Spazio extra prima del pulsante svuota */
        }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background-color: #f9f9f9;
            border-bottom: 1px solid #eee;
            border-radius: 6px;
            margin-bottom: 8px;
        }
        
        li span {
            cursor: pointer;
            flex: 1;
        }

        .completed {
            text-decoration: line-through;
            color: #aaa;
        }

        .delete-btn {
            background-color: #ff5252;
            padding: 5px 10px;
            font-size: 12px;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background-color: #e04444;
        }

        /* NOVITÀ CSS: Stile per il pulsante Svuota Tutto */
        .clear-btn {
            background-color: #757575;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%; /* Copre tutta la larghezza della schedina */
            margin-top: 10px;
        }
        .clear-btn:hover {
            background-color: #5c5c5c;
        }
    </style>
</head>
<body>

    <div class="todo-container">
        <h2>Le mie attività</h2>
        <div class="input-area">
            <input type="text" id="nuovoInput" placeholder="Cosa devi fare oggi?" onkeydown="ascoltaInvio(event)">
            <button type="button" onclick="inserisciNota()">Aggiungi</button>
        </div>
        <ul id="nuovaLista"></ul>
        
        <!-- NOVITÀ HTML: Il nuovo pulsante in fondo alla lista -->
        <button type="button" class="clear-btn" onclick="svuotaLista()">Svuota Tutto</button>
    </div>

    <script>
        function inserisciNota() {
            var elementoInput = document.getElementById('nuovoInput');
            var testoPulito = elementoInput.value.trim();

            if (testoPulito === "") {
                alert("Scrivi qualcosa prima di aggiungere!");
                return;
            }

            var contenitoreLista = document.getElementById('nuovaLista');
            var nuovoElementoLi = document.createElement('li');
            
            nuovoElementoLi.innerHTML = '<span onclick="sbarraNota(this)">' + testoPulito + '</span><button class="delete-btn" onclick="cancellaNota(this)">Elimina</button>';
            
            contenitoreLista.appendChild(nuovoElementoLi);
            elementoInput.value = "";
        }

        function cancellaNota(pulsante) {
            var rigaDaCancellare = pulsante.parentElement;
            rigaDaCancellare.remove();
        }

        function ascoltaInvio(evento) {
            if (evento.key === "Enter") {
                inserisciNota();
            }
        }

        function sbarraNota(elementoTesto) {
            elementoTesto.classList.toggle('completed');
        }

        /* FUNZIONE NUOVA: Cancella tutti gli elementi all'interno di <ul> */
        function svuotaLista() {
            // Chiede conferma prima di cancellare tutto per evitare click per sbaglio
            if (confirm("Sei sicuro di voler cancellare tutte le attività?")) {
                var contenitoreLista = document.getElementById('nuovaLista');
                contenitoreLista.innerHTML = ""; // Svuota completamente l'HTML interno alla lista
            }
        }
    </script>

</body>
</html>
